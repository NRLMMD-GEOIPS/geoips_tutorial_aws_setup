# Set the correct Connection header for normal HTTP and WebSocket requests.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# HTTP redirect to HTTPS
server {
    listen 80;
    server_name geoips-tutorial.org;

    # Redirect all HTTP requests to HTTPS
    return 301 https://$host$request_uri;
}

# HTTPS server block
server {
    listen 443 ssl http2;
    server_name geoips-tutorial.org;

    ssl_certificate     /etc/ssl/certs/jupyterhub.crt;
    ssl_certificate_key /etc/ssl/private/jupyterhub.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    location / {
        proxy_pass http://127.0.0.1:8000;

        # Preserve original client info
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        client_max_body_size 50M;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Reduce latency for real-time applications
        proxy_buffering off;
    }
}
